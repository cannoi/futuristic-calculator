<!DOCTYPE html><html lang='vi'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Futuristic Calculator</title><link rel='stylesheet' href='style.css'><style>.paf-made-by{position:fixed;right:8px;bottom:8px;width:min(72px,12vw);max-width:12vw;height:auto;object-fit:contain;opacity:.5;background:transparent;padding:0;border:0;box-shadow:none;filter:none;pointer-events:none;z-index:30}</style></head><body><div class='calculator'><div class='display'><div id='history'></div><div id='result'>0</div></div><div class='buttons'><button class='op' onclick='clearAll()'>AC</button><button class='op' onclick='deleteLast()'>DEL</button><button class='op' onclick='appendOp("÷")'>÷</button><button class='op' onclick='appendOp("×")'>×</button><button onclick='appendNum("7")'>7</button><button onclick='appendNum("8")'>8</button><button onclick='appendNum("9")'>9</button><button class='op' onclick='appendOp("-")'>-</button><button onclick='appendNum("4")'>4</button><button onclick='appendNum("5")'>5</button><button onclick='appendNum("6")'>6</button><button class='op' onclick='appendOp("+")'>+</button><button onclick='appendNum("1")'>1</button><button onclick='appendNum("2")'>2</button><button onclick='appendNum("3")'>3</button><button class='eq' onclick='calculate()'>=</button><button class='zero' onclick='appendNum("0")'>0</button><button onclick='appendNum(".")'>.</button></div><div class='paf-made-by'>Made with App Builder — Pi SoloHost</div></div><script src='script.js'></script><img class="paf-made-by" src="/made-by.png" alt="Made with App Builder — Pi SoloHost"></body></html>
